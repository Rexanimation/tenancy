services:
  - type: web
    name: tenancy-tracker
    env: node
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install --production
    startCommand: node index.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_SAHIL_EMAIL
        sync: false
      - key: ADMIN_SAHIL_REFRESH_TOKEN
        sync: false
      - key: ADMIN_NICK_EMAIL
        sync: false
      - key: ADMIN_NICK_REFRESH_TOKEN
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: static
    name: tenancy-frontend
    env: static
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://tenancy-tracker.onrender.com
